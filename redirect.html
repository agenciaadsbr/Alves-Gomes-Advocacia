<style>
  :root{
    --paper:#f7f5ef;
    --navy:#27272a;
    --navy-soft:#39393d;
    --ink-soft:#c9c9cc;
    --gold:#a9843f;
    --gold-soft:#d9c48a;
    --green:#1e9e54;
    --serif:'Newsreader', Georgia, serif;
    --sans:'IBM Plex Sans', -apple-system, sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:radial-gradient(120% 90% at 15% 0%, var(--navy-soft), var(--navy) 60%);
    color:var(--paper);
    font-family:var(--sans);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .card{
    text-align:center;
    max-width:420px;
  }
  .brand{
    font-family:var(--serif);
    font-size:1.05rem;
    color:var(--gold-soft);
    margin-bottom:28px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:12px;
  }
  .brand img{ height:52px; width:auto; }
  .spinner{
    width:46px; height:46px;
    margin:0 auto 28px;
    border-radius:50%;
    border:3px solid rgba(244,245,241,.18);
    border-top-color:var(--green);
    animation:spin 0.9s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  h1{
    font-family:var(--serif);
    font-weight:500;
    font-size:1.5rem;
    margin:0 0 12px;
  }
  p{
    color:var(--ink-soft);
    font-size:.98rem;
    line-height:1.6;
    margin:0;
  }
  .fallback{
    margin-top:28px;
    font-size:.88rem;
  }
  .fallback a{
    color:var(--gold-soft);
    text-decoration:underline;
  }
  @media (prefers-reduced-motion: reduce){
    .spinner{ animation:none; border-top-color:rgba(244,245,241,.18); }
  }
</style>
</head>
